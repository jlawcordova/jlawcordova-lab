name: Docs site

# Builds the developer docs site (scripts/docs-site/, `npm run docs:site`)
# from the README files and docs/. Every pull request builds it, so a broken
# link fails the PR; a push to main (or a manual run) also deploys it to
# GitHub Pages. Pages has to be on for the repo, with Source: GitHub Actions
# (docs/contributing.md, "The docs site").
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Until cutover, cli/test/helpers.mjs reads the format-1 examples from
        # PR 2's merge commit (git archive 00ef555), so the history must be there.
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      # The reference is generated by the program (pixellab help --markdown),
      # so the pinned Rust toolchain builds it first.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build the program
        run: cargo build --release
      # Publish the reference only if it matches the program.
      - name: Check docs/cli.md is current
        run: node scripts/docs-cli.mjs --check
      - name: Test the docs site
        run: node --test scripts/test/docs-site.test.mjs
      - name: Build the docs site
        run: npm run docs:site
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs-site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time, and never cancel one halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
